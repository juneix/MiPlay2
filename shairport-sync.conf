// MiPlay 原生对接专用 Shairport-Sync 配置文件样板 (shairport-sync.conf.example)
// 拷贝至宿主机 /etc/shairport-sync.conf 即可使原生 Shairport-Sync 的 AirPlay 2 音频流重定向至 MiPlay 管道

general = {
    name = "MiPlay 全屋播放";         // 局域网广播设备名称
    output_backend = "pipe";          // 关键：必须指定为 pipe 模式，而非 alsa
};

pipe = {
    name = "/tmp/shairport/audio.fifo";  // 关键：音频 FIFO 管道路径
};

metadata = {
    enabled = "yes";
    include_cover_art = "yes";
    pipe_name = "/tmp/shairport/metadata.fifo";
};
