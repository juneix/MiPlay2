<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MiPlay Pod">
  <title>MiPlay - 虚拟音箱</title>
  <link rel="icon" href="/static/icon.png">
  <link rel="apple-touch-icon" href="/static/icon.png">
  <link rel="manifest" href="/pod/manifest.webmanifest">
  <style>
    :root {
      color-scheme: dark;

      /* ===== 画布与页面间距：优先修改这里 ===== */
      /* 固定逻辑画布边长；页面中的坐标都以 640×640 为设计基准。 */
      --design-size: 640px;
      /* 两个正方形画布在当前视口中的实际边长，由 JS 统一计算。 */
      --stage-size: 640px;
      /* 逻辑画布缩放倍率，由 JS 统一计算，不建议手动修改。 */
      --design-scale: 1;
      /* 横屏两画布之间、竖屏两画布之间的间距，由 JS 根据视口计算。 */
      --layout-gap: 64px;
      /* 页面四周安全边距，由 JS 计算并包含屏幕刘海安全区。 */
      --safe-left: 48px;
      --safe-right: 48px;
      --safe-top: 32px;
      --safe-bottom: 32px;

      /* ===== 信息画布尺寸：四个分区必须保持等高 ===== */
      /* 信息/封面的实际内容宽度；640 - 左右各 16px。 */
      --content-size: 608px;
      /* 四等分区域高度；608 / 4。 */
      --zone-height: 152px;
      /* ID3 跑马灯、工具内容和播放进度共享的左右对齐宽度。 */
      --media-content-width: 520px;
      /* 音量轨道宽度：从信息区左边界对齐到音量图标前的按钮间距。 */
      --utility-track-width: calc(var(--media-content-width) - 2 * var(--utility-button-size) - 2 * var(--toolbar-gap));
      /* 音量轨道到音量按钮、音量按钮到全屏按钮共用此间距。 */
      --toolbar-gap: 24px;
      /* 播放控制组宽度。 */
      --transport-width: 480px;
      /* 横屏信息区的轻微纵向校正；四个分区仍保持等高。 */
      --copy-offset-y: -10px;
      --controls-offset-y: 10px;

      /* ===== 字号与文字间距：可直接独立调整 ===== */
      /* 歌曲名字号、字重、行高。 */
      --title-font-size: 44px;
      --title-font-weight: 700;
      --title-line-height: 1.22;
      /* 歌手字号、字重、行高。 */
      --artist-font-size: 28px;
      --artist-font-weight: 600;
      --artist-line-height: 36px;
      /* 专辑字号、字重、行高；专辑是第三层辅助信息。 */
      --album-font-size: 22px;
      --album-font-weight: 500;
      --album-line-height: 28px;
      /* 歌曲名与歌手之间的垂直间距。 */
      --title-subtitle-gap: 20px;
      /* 歌手与专辑之间的垂直间距。 */
      --artist-album-gap: 4px;
      /* 进度时间字号、字重、行高；对应底部左右两个时间数字。 */
      --time-font-size: 24px;
      --time-font-weight: 700;
      --time-line-height: 30px;
      /* 进度轨道与时间文字之间的垂直间距。 */
      --track-time-gap: 14px;

      /* ===== 图标与轨道尺寸：可直接独立调整 ===== */
      /* 顶部音量/全屏图标尺寸。 */
      --utility-icon-size: 38px;
      /* 顶部音量/全屏按钮的点击区域尺寸。 */
      --utility-button-size: 52px;
      /* 上一曲/下一曲图标尺寸。 */
      --transport-icon-size: 52px;
      /* 播放/暂停图标尺寸。 */
      --primary-icon-size: 82px;
      /* 音量条和进度条统一厚度；两者必须共用此变量。 */
      --track-height: 18px;
      /* 轨道圆角等于厚度的一半，形成 StandBy 风格胶囊形轨道。 */
      --track-radius: 9px;

      /* ===== 颜色 ===== */
      --fg: #fff;
      --muted: rgba(255, 255, 255, .66);
      --disabled: rgba(255, 255, 255, .32);
    }

    * { box-sizing: border-box; }

    /* Pod 是展示端，禁止拖选、复制文字或拖拽图片。 */
    html, body, button, input, img, .design { user-select: none; -webkit-user-select: none; }
    img { -webkit-user-drag: none; }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #08090d;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    }

    button,
    input { font: inherit; }

    #fluid {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: .88;
    }

    .layout {
      position: fixed;
      left: var(--safe-left);
      right: var(--safe-right);
      top: var(--safe-top);
      bottom: var(--safe-bottom);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--layout-gap);
      overflow: visible;
    }

    .stage {
      position: relative;
      flex: 0 0 var(--stage-size);
      width: var(--stage-size);
      height: var(--stage-size);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .art-stage {
      overflow: visible;
      z-index: 2;
    }

    .info-stage {
      z-index: 1;
    }

    .design {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--design-size);
      height: var(--design-size);
      transform: translate(-50%, -50%) scale(var(--design-scale));
      transform-origin: center;
    }

    .art-design {
      display: grid;
      place-items: center;
    }

    .artwork-shell {
      position: relative;
      width: var(--content-size);
      height: var(--content-size);
      overflow: visible;
      border-radius: 28px;
      background: transparent;
      perspective: 1800px;
    }

    /* 这里只是封面区域的高斯阴影底，不参与封面翻转，也不覆盖面片。 */
    .artwork-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: 28px;
      background: rgba(0, 0, 0, .26);
      filter: blur(28px);
      transform: scale(.96);
      pointer-events: none;
    }

    .artwork-media {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--front-artwork-width, var(--content-size));
      height: var(--front-artwork-height, var(--content-size));
      transform: rotateY(0deg);
      translate: -50% -50%;
      transform-origin: center;
      transform-style: preserve-3d;
      z-index: 10;
    }

    .artwork-face {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--face-width, var(--content-size));
      height: var(--face-height, var(--content-size));
      overflow: hidden;
      border-radius: 28px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .artwork-face.front {
      --face-width: var(--front-artwork-width, var(--content-size));
      --face-height: var(--front-artwork-height, var(--content-size));
      transform: translate(-50%, -50%) rotateY(0deg);
    }

    .artwork-face.back {
      --face-width: var(--back-artwork-width, var(--content-size));
      --face-height: var(--back-artwork-height, var(--content-size));
      transform: translate(-50%, -50%) rotateY(180deg);
    }

    .artwork {
      display: block;
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0;
    }

    .artwork.ready { opacity: 1; }

    .artwork-media.artwork-switch { animation: artwork-flip .8s cubic-bezier(.45, .05, .55, .95) both; }
    @keyframes artwork-flip {
      from { transform: rotateY(0deg) translateZ(0); }
      to { transform: rotateY(-180deg) translateZ(0); }
    }

    .artwork-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      border-radius: 28px;
      border: 0;
      color: rgba(255, 255, 255, .32);
      background: transparent;
      overflow: hidden;
      z-index: 1;
    }

    /* 必须显式覆盖 display:grid，否则 hidden 属性可能无法隐藏默认 poster。 */
    .artwork-fallback[hidden] { display: none; }

    .artwork-fallback svg { width: 168px; height: 168px; stroke-width: 1.25; }

    .artwork-fallback.poster-error {
      border: 0;
    }

    .artwork-fallback:not(.poster-error) svg { display: none; }
    .artwork-fallback.poster-error .fallback-poster { display: none; }

    .fallback-poster {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .info-design {
      /* 与左侧 art-design 共用 640×640 缩放外壳，禁止在这里覆盖 design 尺寸。 */
      display: grid;
      place-items: center;
      color: var(--fg);
      text-align: center;
      text-shadow: 0 2px 18px rgba(0, 0, 0, .22);
    }

    .info-frame {
      width: var(--content-size);
      height: var(--content-size);
      display: grid;
      /* 四个真实 DOM 分区，每一区严格等高。 */
      grid-template-rows: repeat(4, 1fr);
      grid-template-columns: 1fr;
    }

    .info-zone {
      position: relative;
      width: 100%;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
    }

    .toolbar {
      grid-row: 1;
      /* 横屏顶部工具贴齐 608px 信息框上边缘。 */
      align-items: flex-start;
    }

    .toolbar-inner {
      position: relative;
      width: var(--media-content-width);
      /* 工具栏自身高度；只影响按钮垂直点击区，不影响分区高度。 */
      height: var(--utility-button-size);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      /* 音量按钮与全屏按钮之间的水平间距。 */
      gap: var(--toolbar-gap);
    }

    .icon-button {
      width: var(--utility-button-size);
      height: var(--utility-button-size);
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 0;
      color: rgba(255, 255, 255, .9);
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-button svg { width: var(--utility-icon-size); height: var(--utility-icon-size); stroke-width: 2.35; }
    .icon-button:disabled { color: var(--disabled); cursor: default; }

    .volume-wrap {
      position: static;
      flex: 0 0 var(--utility-button-size);
      width: var(--utility-button-size);
      height: var(--utility-button-size);
    }

    .volume-pop {
      position: absolute;
      /* 音量轨道右端与音量按钮左端保持与工具按钮相同的 24px 视觉间距。 */
      left: 0;
      right: auto;
      top: 0;
      z-index: 4;
      /* 展开后音量轨道宽度；左端与进度轨道严格对齐。 */
      width: var(--utility-track-width);
      height: var(--utility-button-size);
      padding: 0;
      display: none;
      align-items: center;
    }

    .volume-pop.open { display: flex; }

    .volume-pop input {
      width: var(--utility-track-width);
      height: var(--track-height);
      margin: 0;
      border: 0;
      border-radius: var(--track-radius);
      outline: 0;
      background: linear-gradient(to right, #fff 0 var(--volume-percent, 80%), rgba(255, 255, 255, .34) var(--volume-percent, 80%) 100%);
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .volume-pop input::-webkit-slider-runnable-track {
      height: var(--track-height);
      border-radius: var(--track-radius);
      background: transparent;
    }

    .volume-pop input::-webkit-slider-thumb {
      /* StandBy 样式不显示滑块圆点；range 本体仍保留点击和拖动能力。 */
      width: 0;
      height: 0;
      margin-top: calc(var(--track-height) / 2);
      border: 0;
      border-radius: 0;
      background: transparent;
      -webkit-appearance: none;
    }

    .volume-pop input::-moz-range-track {
      height: var(--track-height);
      border-radius: var(--track-radius);
      background: transparent;
    }

    .volume-pop input::-moz-range-thumb {
      /* Firefox 同样隐藏滑块圆点。 */
      width: 0;
      height: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .copy {
      grid-row: 2;
      flex-direction: column;
      transform: translateY(var(--copy-offset-y));
    }

    .copy-inner { width: var(--media-content-width); min-width: 0; }

    /* 长文本滚动视口：只裁切超出内容，不改变四分区尺寸。 */
    .marquee-viewport { width: 100%; overflow: hidden; text-align: center; }
    .marquee-viewport[hidden] { display: none; }
    /* 溢出后从视口左边开始滚动，确保移动距离等于真实溢出宽度。 */
    .marquee-viewport.is-overflow { text-align: left; }
    .marquee-content { display: inline-block; white-space: nowrap; transform: translateX(0); }
    .marquee-content.is-overflow {
      display: flex;
      width: max-content;
      gap: var(--marquee-gap, 2em);
      animation-name: pod-marquee;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-delay: 1.2s;
    }
    @keyframes pod-marquee {
      0%, 12% { transform: translateX(0); }
      88%, 100% { transform: translateX(var(--marquee-shift)); }
    }

    .title {
      margin: 0;
      font-size: var(--title-font-size);
      font-weight: var(--title-font-weight);
      line-height: var(--title-line-height);
      letter-spacing: 0;
    }

    .artist {
      margin: var(--title-subtitle-gap) 0 0;
      color: var(--muted);
      font-size: var(--artist-font-size);
      font-weight: var(--artist-font-weight);
      line-height: var(--artist-line-height);
      letter-spacing: 0;
    }

    .album {
      margin: var(--artist-album-gap) 0 0;
      color: rgba(255, 255, 255, .48);
      font-size: var(--album-font-size);
      font-weight: var(--album-font-weight);
      line-height: var(--album-line-height);
      letter-spacing: 0;
    }

    .album[hidden] { display: none; }

    .controls {
      grid-row: 3;
      transform: translateY(var(--controls-offset-y));
    }

    .controls-inner {
      width: var(--transport-width);
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .transport {
      width: 76px;
      height: 76px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      color: var(--disabled);
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .transport svg {
      width: var(--transport-icon-size);
      height: var(--transport-icon-size);
      fill: currentColor;
      stroke: none;
    }

    .transport.primary { width: 94px; height: 88px; }
    .transport.primary svg { width: var(--primary-icon-size); height: var(--primary-icon-size); }
    .transport:disabled { cursor: default; }
    .transport:not(:disabled) { color: #fff; }
    .transport:disabled { color: #b8b8b8; }

    #previousButton,
    #nextButton { position: relative; }

    #previousButton::before,
    #nextButton::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 46px;
      border-radius: 4px;
      background: currentColor;
    }

    #previousButton::before { left: 9px; }
    #nextButton::after { right: 9px; }

    .progress-block {
      grid-row: 4;
      display: flex;
      visibility: hidden;
      /* 横屏进度内容贴齐 608px 信息框下边缘。 */
      align-items: flex-end;
    }

    .progress-block.visible { visibility: visible; }

    .progress-inner { width: var(--media-content-width); }

    .progress-track {
      position: relative;
      width: var(--media-content-width);
      height: var(--track-height);
      overflow: hidden;
      border-radius: var(--track-radius);
      background: rgba(255, 255, 255, .34);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      /* 进度高亮右端为直角，只有整条轨道的外侧左右端保持胶囊圆角。 */
      border-radius: var(--track-radius) 0 0 var(--track-radius);
      background: #fff;
    }

    .progress-fill.empty { visibility: hidden; }

    .times {
      margin-top: var(--track-time-gap);
      display: flex;
      justify-content: space-between;
      color: rgba(255, 255, 255, .62);
      font-size: var(--time-font-size);
      font-weight: var(--time-font-weight);
      line-height: var(--time-line-height);
      font-variant-numeric: tabular-nums;
    }

    @media (orientation: portrait) {
      .layout { flex-direction: column; }

      .toolbar { grid-row: 4; }
      .progress-block { grid-row: 1; }
      .controls { grid-row: 2; }
      .copy { grid-row: 3; }

      /* 竖屏顺序反转后，进度贴顶部、工具贴底部。 */
      .toolbar { align-items: flex-end; }
      .progress-block { align-items: flex-start; }

      .volume-pop {
        top: 0;
        left: 0;
      }

      .copy,
      .controls {
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .artwork-media { animation: none !important; }
      .artwork-fallback { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="fluid" aria-hidden="true"></canvas>
  <main class="layout" aria-label="MiPlay 虚拟音箱">
    <section class="stage art-stage" aria-label="专辑封面">
      <div class="design art-design">
        <div class="artwork-shell">
          <div class="artwork-media" id="artworkMedia">
            <div class="artwork-face front">
              <div class="artwork-fallback" id="artworkFallback">
                <img class="fallback-poster" id="fallbackPoster" src="/static/poster.png" alt="">
                <i data-lucide="music-4"></i>
              </div>
              <img class="artwork" id="artwork" alt="">
            </div>
            <div class="artwork-face back">
              <div class="artwork-fallback" id="nextArtworkFallback" hidden>
                <img class="fallback-poster" id="nextFallbackPoster" src="/static/poster.png" alt="">
                <i data-lucide="music-4"></i>
              </div>
              <img class="artwork" id="nextArtwork" alt="">
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="stage info-stage" aria-live="polite">
      <div class="design info-design">
        <div class="info-frame">
          <div class="info-zone toolbar">
            <div class="toolbar-inner">
              <div class="volume-wrap" id="volumeWrap">
                <button class="icon-button" id="volumeButton" type="button" aria-label="网页音量" aria-expanded="false">
                  <i data-lucide="volume-2"></i>
                </button>
                <div class="volume-pop" id="volumePop">
                  <input id="volumeRange" type="range" min="0" max="1" step="0.01" aria-label="网页音量">
                </div>
              </div>
              <button class="icon-button" id="fullscreenButton" type="button" aria-label="进入全屏">
                <i data-lucide="maximize-2"></i>
              </button>
            </div>
          </div>

          <div class="info-zone copy">
            <div class="copy-inner">
              <div class="marquee-viewport" id="titleViewport">
                <h1 class="marquee-content title" id="trackTitle">MiPlay 全屋播放</h1>
              </div>
              <div class="marquee-viewport" id="artistViewport">
                <p class="marquee-content artist" id="trackArtist">等待播放</p>
              </div>
              <div class="marquee-viewport" id="albumViewport" hidden>
                <p class="marquee-content album" id="trackAlbum"></p>
              </div>
            </div>
          </div>

          <div class="info-zone controls" aria-label="中枢媒体控制">
            <div class="controls-inner">
              <button class="transport" id="previousButton" type="button" aria-label="上一曲" disabled><i data-lucide="skip-back"></i></button>
              <button class="transport primary" id="playPauseButton" type="button" aria-label="播放" disabled><i data-lucide="play"></i></button>
              <button class="transport" id="nextButton" type="button" aria-label="下一曲" disabled><i data-lucide="skip-forward"></i></button>
            </div>
          </div>

          <div class="info-zone progress-block" id="progressBlock">
            <div class="progress-inner">
              <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
              <div class="times"><span id="currentTime">0:00</span><span id="durationTime">--:--</span></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/lib/lucide.min.js"></script>
  <script>
    (() => {
      "use strict";

      const DESIGN_SIZE = 640;
      const STORAGE_VOLUME = "miplay_pod_volume";
      const STORAGE_MUTED_VOLUME = "miplay_pod_unmuted_volume";
      const CHANNEL_NAME = "miplay_pod_master";
      const STORAGE_BACKGROUND_QUALITY = "miplay_pod_background_quality";
      const FALLBACK_COLORS = ["#10131d", "#283452", "#5c365e", "#b85c63"];
      const $ = (id) => document.getElementById(id);
      const audio = new Audio();
      audio.preload = "none";

      let currentSession = null;
      let currentSessionId = 0;
      let currentClientIp = "";
      let currentStreamUrl = "";
      let audioUnlocked = false;
      let pendingPlay = null;
      let streamRetryTimer = 0;
      let ws = null;
      let wsRetryTimer = 0;
      let wsRetryCount = 0;
      let pingTimer = 0;
      let wakeLock = null;
      let palette = FALLBACK_COLORS.slice();
      let targetPalette = FALLBACK_COLORS.slice();
      let paletteArtwork = "";
      let artworkFallbackTimer = 0;
      let artworkRequestId = 0;
      let pendingArtworkSource = "";
      let awaitingArtworkTrackKey = "";
      let currentTrackKey = "";
      let pendingArtworkFlip = null;
      let lastSongMetadata = {};
      let lastSongProgress = null;
      let animationFrame = 0;
      let backgroundQuality = "high";
      let backgroundFrameInterval = 1000 / 60;
      let backgroundLastFrame = 0;
      let backgroundSlowFrames = 0;
      let isMaster = !window.BroadcastChannel;
      const tabId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      let channel = null;

      function safeNumber(value, fallback = 0) {
        const number = Number(value);
        return Number.isFinite(number) ? number : fallback;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function detectBackgroundQuality() {
        const requested = new URLSearchParams(location.search).get("background");
        if (["high", "low"].includes(requested)) {
          localStorage.setItem(STORAGE_BACKGROUND_QUALITY, requested);
          return requested;
        }
        const saved = localStorage.getItem(STORAGE_BACKGROUND_QUALITY);
        if (["high", "low"].includes(saved)) return saved;
        const ua = navigator.userAgent;
        const androidChrome = ua.match(/Android.*Chrome\/(\d+)/i);
        const oldAndroidChrome = androidChrome && Number(androidChrome[1]) <= 119;
        const lowMemory = navigator.deviceMemory && navigator.deviceMemory <= 2;
        const lowCpu = navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4;
        return oldAndroidChrome || lowMemory || lowCpu ? "low" : "high";
      }

      function configureBackgroundQuality(quality) {
        backgroundQuality = quality === "low" ? "low" : "high";
        backgroundFrameInterval = 1000 / (backgroundQuality === "high" ? 60 : 24);
        resizeBackground();
      }

      function resizeLayout() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const portrait = vh > vw;
        const insetLeft = safeNumber(getComputedStyle(document.documentElement).getPropertyValue("env(safe-area-inset-left)"), 0);
        const baseX = clamp(vw * (portrait ? .055 : .045), 18, portrait ? 42 : 112);
        const baseY = clamp(vh * .045, 18, 64);
        const safeLeft = baseX + insetLeft;
        const safeRight = baseX;
        const safeTop = baseY;
        const safeBottom = baseY;
        const gap = clamp((portrait ? vh : vw) * (portrait ? .025 : .035), portrait ? 14 : 26, portrait ? 32 : 80);
        const widthAvailable = Math.max(1, vw - safeLeft - safeRight);
        const heightAvailable = Math.max(1, vh - safeTop - safeBottom);
        const size = portrait
          ? Math.min(widthAvailable, (heightAvailable - gap) / 2)
          : Math.min(heightAvailable, (widthAvailable - gap) / 2);
        /* 宽而细长的横屏设备中，95% 画布尺寸会把封面贴到上下边缘。
           按视口宽高比平滑收窄内容区，最多保留约 24px 的上下呼吸空间。 */
        const aspect = vw / Math.max(1, vh);
        const wideProgress = portrait ? 0 : clamp((aspect - 1.55) / .75, 0, 1);
        const contentSize = 608 - Math.round(wideProgress * 48);
        const contentRatio = contentSize / 608;
        const root = document.documentElement.style;
        root.setProperty("--stage-size", `${Math.max(1, size)}px`);
        root.setProperty("--design-scale", String(Math.max(1, size) / DESIGN_SIZE));
        root.setProperty("--layout-gap", `${gap}px`);
        root.setProperty("--safe-left", `${safeLeft}px`);
        root.setProperty("--safe-right", `${safeRight}px`);
        root.setProperty("--safe-top", `${safeTop}px`);
        root.setProperty("--safe-bottom", `${safeBottom}px`);
        root.setProperty("--content-size", `${contentSize}px`);
        root.setProperty("--zone-height", `${contentSize / 4}px`);
        root.setProperty("--media-content-width", `${Math.round(520 * contentRatio)}px`);
        root.setProperty("--transport-width", `${Math.round(480 * contentRatio)}px`);
        resizeBackground();
      }

      function resizeBackground() {
        const canvas = $("fluid");
        const scale = backgroundQuality === "high" ? .5 : .28;
        const width = Math.max(1, Math.round(innerWidth * scale));
        const height = Math.max(1, Math.round(innerHeight * scale));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
      }

      function drawBackground(time) {
        if (document.hidden) {
          animationFrame = 0;
          return;
        }
        animationFrame = requestAnimationFrame(drawBackground);
        const elapsed = time - backgroundLastFrame;
        if (elapsed < backgroundFrameInterval) return;
        backgroundLastFrame = time - (elapsed % backgroundFrameInterval);
        if (backgroundQuality === "high") {
          backgroundSlowFrames = elapsed > 42 ? backgroundSlowFrames + 1 : Math.max(0, backgroundSlowFrames - 1);
          if (backgroundSlowFrames > 45) {
            configureBackgroundQuality("low");
            backgroundSlowFrames = 0;
          }
        }
        const canvas = $("fluid");
        const context = canvas.getContext("2d");
        if (!context) return;
        const width = canvas.width;
        const height = canvas.height;
        palette = palette.map((color, index) => mixHex(color, targetPalette[index] || targetPalette[0], .045));
        context.fillStyle = palette[0];
        context.fillRect(0, 0, width, height);
        const t = time * (backgroundQuality === "high" ? .00045 : .00028);
        const points = backgroundQuality === "high" ? [
          [.18 + Math.sin(t) * .18, .20 + Math.cos(t * 1.2) * .16, .58],
          [.82 + Math.cos(t * .8) * .18, .22 + Math.sin(t * 1.1) * .15, .62],
          [.25 + Math.cos(t * 1.3) * .20, .82 + Math.sin(t * .9) * .14, .64],
          [.80 + Math.sin(t * 1.05) * .17, .76 + Math.cos(t * .75) * .16, .56]
        ] : [
          [.22 + Math.sin(t) * .10, .25 + Math.cos(t) * .08, .74],
          [.78 + Math.cos(t * .8) * .10, .70 + Math.sin(t) * .08, .76],
          [.50 + Math.sin(t * .65) * .08, .48 + Math.cos(t * .7) * .07, .68]
        ];
        points.forEach((point, index) => {
          const x = point[0] * width;
          const y = point[1] * height;
          const radius = Math.max(width, height) * point[2];
          const gradient = context.createRadialGradient(x, y, 0, x, y, radius);
          gradient.addColorStop(0, (palette[index] || palette[0]) + (backgroundQuality === "high" ? "e8" : "d0"));
          gradient.addColorStop(.68, (palette[index] || palette[0]) + "70");
          gradient.addColorStop(1, palette[index] + "00");
          context.fillStyle = gradient;
          context.beginPath();
          context.arc(x, y, radius, 0, Math.PI * 2);
          context.fill();
        });
        const shade = context.createRadialGradient(width * .5, height * .42, 0, width * .5, height * .42, Math.max(width, height) * .78);
        shade.addColorStop(0, "rgba(0,0,0,0)");
        shade.addColorStop(1, "rgba(0,0,0,.42)");
        context.fillStyle = shade;
        context.fillRect(0, 0, width, height);
      }

      function colorDistance(a, b) {
        return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
      }

      function rgbToHex(rgb) {
        return "#" + rgb.map((value) => clamp(Math.round(value), 0, 255).toString(16).padStart(2, "0")).join("");
      }

      function hexToRgb(color) {
        const value = color.replace("#", "");
        return [0, 2, 4].map((offset) => parseInt(value.slice(offset, offset + 2), 16));
      }

      function mixHex(from, to, amount) {
        const a = hexToRgb(from);
        const b = hexToRgb(to);
        return rgbToHex(a.map((value, index) => value + (b[index] - value) * amount));
      }

      function extractPalette(image, source) {
        if (!source || source === paletteArtwork) return;
        paletteArtwork = source;
        try {
          const sample = document.createElement("canvas");
          sample.width = 32;
          sample.height = 32;
          const context = sample.getContext("2d", { willReadFrequently: true });
          context.drawImage(image, 0, 0, 32, 32);
          const data = context.getImageData(0, 0, 32, 32).data;
          const candidates = [];
          for (let index = 0; index < data.length; index += 16) {
            if (data[index + 3] < 180) continue;
            const rgb = [data[index], data[index + 1], data[index + 2]];
            const max = Math.max(...rgb);
            const min = Math.min(...rgb);
            if (max < 22 || min > 238 || max - min < 12) continue;
            candidates.push({ rgb, luminance: rgb[0] * .2126 + rgb[1] * .7152 + rgb[2] * .0722, saturation: max - min });
          }
          if (!candidates.length) return;
          candidates.sort((a, b) => a.luminance - b.luminance);
          const selected = [candidates[Math.floor(candidates.length * .12)].rgb];
          candidates.sort((a, b) => b.saturation - a.saturation);
          for (const candidate of candidates) {
            if (selected.every((color) => colorDistance(color, candidate.rgb) > 62)) selected.push(candidate.rgb);
            if (selected.length === 4) break;
          }
          while (selected.length < 4) selected.push(candidates[Math.floor(candidates.length * selected.length / 4)].rgb);
          const extracted = selected.map(rgbToHex);
          targetPalette = backgroundQuality === "high" ? extracted : extracted.slice(0, 3);
        } catch (_) {
          targetPalette = FALLBACK_COLORS.slice();
        }
      }

      function artworkFace(next = false) {
        return {
          image: $(next ? "nextArtwork" : "artwork"),
          fallback: $(next ? "nextArtworkFallback" : "artworkFallback"),
          widthProperty: next ? "--back-artwork-width" : "--front-artwork-width",
          heightProperty: next ? "--back-artwork-height" : "--front-artwork-height"
        };
      }

      function setFaceDimensions(next, width, height) {
        const face = artworkFace(next);
        const media = $("artworkMedia");
        media.style.setProperty(face.widthProperty, `${width}px`);
        media.style.setProperty(face.heightProperty, `${height}px`);
        if (!next) {
          media.style.width = `${width}px`;
          media.style.height = `${height}px`;
        }
      }

      function clearFace(next) {
        const face = artworkFace(next);
        face.image.removeAttribute("src");
        face.image.dataset.source = "";
        face.image.classList.remove("ready");
        face.fallback.hidden = true;
        face.fallback.classList.remove("poster-error");
      }

      function applyFaceState(next, state) {
        const face = artworkFace(next);
        setFaceDimensions(next, state.width, state.height);
        if (state.source) {
          face.image.src = state.source;
          face.image.dataset.source = state.source;
          face.image.classList.add("ready");
          face.fallback.hidden = true;
        } else {
          face.image.removeAttribute("src");
          face.image.dataset.source = "";
          face.image.classList.remove("ready");
          const poster = face.fallback.querySelector(".fallback-poster");
          face.fallback.classList.toggle("poster-error", Boolean(poster && poster.hidden));
          face.fallback.hidden = false;
        }
      }

      function cancelArtworkFlip() {
        const media = $("artworkMedia");
        media.classList.remove("artwork-switch");
        pendingArtworkFlip = null;
        clearFace(true);
      }

      function commitArtworkState(state) {
        applyFaceState(false, state);
        clearFace(true);
        if (state.source && state.paletteImage) {
          extractPalette(state.paletteImage, state.source);
        } else if (!state.source) {
          paletteArtwork = "";
          targetPalette = FALLBACK_COLORS.slice();
        }
      }

      function transitionArtwork(state, requestId) {
        const media = $("artworkMedia");
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          commitArtworkState(state);
          return;
        }
        applyFaceState(true, state);
        pendingArtworkFlip = { requestId, state };
        media.classList.remove("artwork-switch");
        void media.offsetWidth;
        media.classList.add("artwork-switch");
      }

      function showFallbackArtwork() {
        cancelArtworkFlip();
        pendingArtworkSource = "";
        const size = safeNumber(parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--content-size")), 608);
        commitArtworkState({ source: "", width: size, height: size });
      }

      function hideArtwork() {
        cancelArtworkFlip();
        const face = artworkFace(false);
        face.image.removeAttribute("src");
        face.image.dataset.source = "";
        face.image.classList.remove("ready");
        face.fallback.hidden = true;
          paletteArtwork = "";
          targetPalette = FALLBACK_COLORS.slice();
      }

      function imageHasArtwork() {
        const image = $("artwork");
        return image.classList.contains("ready") && Boolean(image.dataset.source);
      }

      function setArtwork(source, keepPreviousBriefly = false) {
        const image = $("artwork");
        if (source && (
          image.dataset.source === source ||
          pendingArtworkSource === source ||
          (pendingArtworkFlip && pendingArtworkFlip.state.source === source)
        )) return;
        clearTimeout(artworkFallbackTimer);
        cancelArtworkFlip();
        if (!source) {
          pendingArtworkSource = "";
          const requestId = ++artworkRequestId;
          if (keepPreviousBriefly && imageHasArtwork()) {
            artworkFallbackTimer = window.setTimeout(() => {
              if (requestId === artworkRequestId) hideArtwork();
            }, 1200);
          } else if (keepPreviousBriefly) {
            hideArtwork();
          } else {
            /* 默认 poster 只属于 stopped/idle 空状态。 */
            showFallbackArtwork();
          }
          return;
        }
        const requestId = ++artworkRequestId;
        pendingArtworkSource = source;
        /* 先用临时图片预加载，旧封面在新封面成功前始终留在画面上。 */
        const hadArtwork = image.classList.contains("ready") && Boolean(image.dataset.source);
        const pending = new Image();
        pending.crossOrigin = "anonymous";
        pending.onload = () => {
          if (requestId !== artworkRequestId) return;
          const ratio = pending.naturalWidth / Math.max(1, pending.naturalHeight);
          const maxSize = safeNumber(parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--content-size")), 608);
          const width = ratio >= 1 ? maxSize : Math.max(1, Math.round(maxSize * ratio));
          const height = ratio >= 1 ? Math.max(1, Math.round(maxSize / ratio)) : maxSize;
          const state = { source, width, height, paletteImage: pending };
          pendingArtworkSource = "";
          if (hadArtwork) {
            transitionArtwork(state, requestId);
          } else {
            commitArtworkState(state);
          }
        };
        pending.onerror = () => {
          if (requestId !== artworkRequestId) return;
          pendingArtworkSource = "";
          if (!hadArtwork) showFallbackArtwork();
        };
        pending.src = source;
      }

      $("artworkMedia").addEventListener("animationend", (event) => {
        if (event.animationName !== "artwork-flip") return;
        const media = event.currentTarget;
        const flip = pendingArtworkFlip;
        if (flip && flip.requestId === artworkRequestId) commitArtworkState(flip.state);
        pendingArtworkFlip = null;
        media.classList.remove("artwork-switch");
      });

      function updateMarquee(contentId, viewportId) {
        const content = $(contentId);
        const viewport = $(viewportId);
        if (viewport.hidden) return;
        const text = content.dataset.marqueeText || content.textContent;
        content.dataset.marqueeText = text;
        content.textContent = text;
        viewport.classList.remove("is-overflow");
        content.classList.remove("is-overflow");
        content.style.removeProperty("--marquee-shift");
        content.style.removeProperty("animation-duration");
        requestAnimationFrame(() => {
          const overflow = Math.max(0, content.scrollWidth - viewport.clientWidth);
          if (overflow <= 1) return;
          /* 两份相同文本首尾衔接，间隔约 4 个字母或 2 个汉字，始终向左循环。 */
          content.replaceChildren(
            Object.assign(document.createElement("span"), { textContent: text }),
            Object.assign(document.createElement("span"), { textContent: text })
          );
          viewport.classList.add("is-overflow");
          content.classList.add("is-overflow");
          requestAnimationFrame(() => {
            const first = content.firstElementChild;
            const gap = parseFloat(getComputedStyle(content).columnGap) || 0;
            const distance = first.getBoundingClientRect().width + gap;
            content.style.setProperty("--marquee-shift", `${-distance}px`);
            content.style.setProperty("animation-duration", `${Math.max(9, distance / 34 + 3)}s`);
          });
        });
      }

      function updateMetadataMarquees() {
        updateMarquee("trackTitle", "titleViewport");
        updateMarquee("trackArtist", "artistViewport");
        updateMarquee("trackAlbum", "albumViewport");
      }

      function setMarqueeText(contentId, text) {
        const content = $(contentId);
        content.dataset.marqueeText = text;
        content.textContent = text;
      }

      function icon(name) {
        return `<i data-lucide="${name}"></i>`;
      }

      function refreshIcons() {
        if (window.lucide) window.lucide.createIcons({ attrs: { "aria-hidden": "true" } });
      }

      function formatTime(milliseconds) {
        const seconds = Math.max(0, Math.floor(milliseconds / 1000));
        return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
      }

      function progressPosition(session) {
        const progress = session && session.progress;
        if (!progress) return 0;
        let position = safeNumber(progress.position_ms);
        if (session.state === "playing" && progress.updated_at_ms) position += Math.max(0, Date.now() - safeNumber(progress.updated_at_ms));
        return Math.min(position, safeNumber(progress.duration_ms, position));
      }

      function renderProgress() {
        const active = currentSession && (currentSession.state === "playing" || currentSession.state === "paused");
        const progress = active ? (currentSession.progress || lastSongProgress) : null;
        const duration = safeNumber(progress && progress.duration_ms);
        const visible = active && duration > 0;
        $("progressBlock").classList.toggle("visible", visible);
        if (!visible) {
          $("progressFill").classList.add("empty");
          $("progressFill").style.width = "0%";
          $("currentTime").textContent = "0:00";
          $("durationTime").textContent = "--:--";
          return;
        }
        const progressSession = currentSession.progress ? currentSession : { ...currentSession, progress };
        const position = progressPosition(progressSession);
        $("progressFill").classList.toggle("empty", position <= 0);
        $("progressFill").style.width = `${clamp(position / duration * 100, 0, 100)}%`;
        $("currentTime").textContent = formatTime(position);
        $("durationTime").textContent = formatTime(duration);
      }

      function renderSession(session) {
        if (!session) return;
        const incomingId = safeNumber(session.session_id);
        if (incomingId && incomingId < currentSessionId) return;
        currentSessionId = Math.max(currentSessionId, incomingId);
        const playing = session.state === "playing" || session.state === "paused";
        if (!playing) {
          lastSongMetadata = {};
          lastSongProgress = null;
        } else if (session.progress) {
          lastSongProgress = session.progress;
        }
        const incomingMetadata = session.metadata || {};
        const metadata = playing ? { ...lastSongMetadata, ...incomingMetadata } : {};
        // 状态广播可能先后到达“无 artwork 的基础 session”和“带 artwork
        // 的元数据 session”。同一曲目下不能让空值覆盖已经收到的封面。
        if (playing && lastSongMetadata.artwork && !incomingMetadata.artwork) {
          metadata.artwork = lastSongMetadata.artwork;
        }
        if (playing) lastSongMetadata = metadata;
        currentSession = { ...session, metadata, progress: session.progress || (playing ? lastSongProgress : null) };
        const hasSong = playing && Boolean(metadata.title || metadata.artist || metadata.album || metadata.artwork);
        const artist = hasSong && metadata.artist ? metadata.artist : "";
        const album = hasSong && metadata.album ? metadata.album : "";
        const trackKey = hasSong ? `${metadata.title || ""}\u0000${artist}\u0000${album}` : "";
        currentTrackKey = trackKey;
        setMarqueeText("trackTitle", hasSong && metadata.title ? metadata.title : "MiPlay 全屋播放");
        setMarqueeText("trackArtist", hasSong ? (artist || "等待播放") : "等待播放");
        setMarqueeText("trackAlbum", hasSong ? album : "");
        $("albumViewport").hidden = !album;
        updateMetadataMarquees();
        if (!hasSong) {
          awaitingArtworkTrackKey = "";
          setArtwork("");
        } else if (metadata.artwork) {
          awaitingArtworkTrackKey = "";
          setArtwork(metadata.artwork);
        } else if (awaitingArtworkTrackKey !== trackKey) {
          awaitingArtworkTrackKey = trackKey;
          setArtwork("", true);
        }

        const capabilities = session.capabilities || {};
        $("previousButton").disabled = !hasSong || !capabilities.previous;
        $("nextButton").disabled = !hasSong || !capabilities.next;
        $("playPauseButton").disabled = !hasSong || !capabilities.play_pause;
        $("playPauseButton").innerHTML = icon(session.state === "playing" ? "pause" : "play");
        $("playPauseButton").setAttribute("aria-label", session.state === "playing" ? "暂停" : "播放");
        refreshIcons();
        renderProgress();
        updateMediaSession(currentSession);
      }

      async function sendSessionControl(action) {
        if (!currentSession) return;
        const response = await fetch("/api/v1/session/control", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: currentSession.session_id, action })
        }).catch(() => null);
        if (!response || !response.ok) return;
      }

      function updateMediaSession(session) {
        if (!("mediaSession" in navigator) || !("MediaMetadata" in window)) return;
        const metadata = session.metadata || {};
        navigator.mediaSession.metadata = new MediaMetadata({
          title: metadata.title || "MiPlay 全屋播放",
          artist: metadata.artist || "",
          album: metadata.album || "",
          artwork: metadata.artwork ? [{ src: metadata.artwork }] : [{ src: "/static/icon.png" }]
        });
        navigator.mediaSession.playbackState = session.state === "playing" ? "playing" : session.state === "paused" ? "paused" : "none";
      }

      function getDeviceId() {
        try {
          let id = localStorage.getItem("miplay_device_uuid");
          if (!id) {
            id = `dev_${Math.random().toString(36).slice(2, 10)}_${Date.now().toString(36)}`;
            localStorage.setItem("miplay_device_uuid", id);
          }
          return id;
        } catch (_) {
          return tabId;
        }
      }

      function targetMatches(target) {
        const deviceId = getDeviceId();
        return ["group_all", "virtual_all", "virtual_web", `virtual_${deviceId}`, `virtual_${currentClientIp}`].includes(target || "group_all");
      }

      function report(event, extra = {}) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: "virtual_audio_event", event, session_id: currentSessionId, client_ts: Date.now(), ...extra }));
      }

      function stopAudio() {
        clearTimeout(streamRetryTimer);
        audio.pause();
        audio.removeAttribute("src");
        audio.load();
        currentStreamUrl = "";
        pendingPlay = null;
        report("stopped");
      }

      function playStream(url, sessionId) {
        if (!isMaster || !url) return;
        if (sessionId && sessionId < currentSessionId) return;
        currentSessionId = Math.max(currentSessionId, safeNumber(sessionId));
        const resolved = new URL(url, location.origin);
        resolved.searchParams.set("_pod", String(Date.now()));
        currentStreamUrl = resolved.href;
        pendingPlay = { url: currentStreamUrl, sessionId };
        audio.src = currentStreamUrl;
        report("play_call", { target: "group_all" });
        if (!audioUnlocked) return;
        audio.play().catch((error) => report("play_error", { error: String(error) }));
      }

      function unlockAudioFromGesture() {
        audioUnlocked = true;
        const attempt = audio.play();
        if (attempt && attempt.catch) attempt.catch(() => {});
        if (pendingPlay && currentStreamUrl) {
          audio.src = pendingPlay.url;
          audio.play().catch((error) => report("play_error", { error: String(error) }));
        }
      }

      function reconnectStream() {
        if (!isMaster || !currentStreamUrl || streamRetryTimer) return;
        report("reconnecting");
        streamRetryTimer = setTimeout(() => {
          streamRetryTimer = 0;
          const url = new URL(currentStreamUrl);
          url.searchParams.set("_pod", String(Date.now()));
          audio.src = url.href;
          audio.play().catch(() => reconnectStream());
        }, 1200);
      }

      function handleMessage(message) {
        if (message.client_ip) currentClientIp = message.client_ip;
        if (message.session) renderSession(message.session);
        if (message.type === "session_init" && message.session && message.session.state === "playing" && message.session.stream_url) {
          playStream(message.session.stream_url, message.session.session_id);
        }
        if (message.type !== "control_command") return;
        const sessionId = safeNumber(message.session_id);
        if (sessionId && sessionId < currentSessionId) return;
        if (!targetMatches(message.target)) return;
        report("command_received", { target: message.target || "group_all" });
        if (message.action === "play_url" && message.url) playStream(message.url, sessionId);
        if (message.action === "stop") {
          stopAudio();
        } else if (message.action === "pause") {
          clearTimeout(streamRetryTimer);
          audio.pause();
          report("paused");
        }
      }

      function connectWebSocket() {
        if (!isMaster || (ws && [WebSocket.OPEN, WebSocket.CONNECTING].includes(ws.readyState))) return;
        clearTimeout(wsRetryTimer);
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${location.host}/api/ws?role=pod&device_id=${encodeURIComponent(getDeviceId())}`);
        ws.onopen = () => {
          wsRetryCount = 0;
          clearInterval(pingTimer);
          pingTimer = setInterval(() => ws && ws.readyState === WebSocket.OPEN && ws.send(JSON.stringify({ type: "ping" })), 12000);
        };
        ws.onmessage = (event) => {
          try { handleMessage(JSON.parse(event.data)); } catch (_) {}
        };
        ws.onclose = () => {
          clearInterval(pingTimer);
          ws = null;
          if (!isMaster) return;
          const delay = Math.min(10000, 700 * 2 ** Math.min(wsRetryCount++, 4));
          wsRetryTimer = setTimeout(connectWebSocket, delay);
        };
      }

      function disconnectWebSocket() {
        clearTimeout(wsRetryTimer);
        clearInterval(pingTimer);
        if (ws) ws.close();
        ws = null;
      }

      function becomeMaster() {
        if (isMaster) return;
        isMaster = true;
        channel && channel.postMessage({ type: "master", tabId });
        connectWebSocket();
        if (currentSession && currentSession.state === "playing" && currentSession.stream_url) playStream(currentSession.stream_url, currentSession.session_id);
      }

      function yieldMaster() {
        if (!isMaster) return;
        isMaster = false;
        stopAudio();
        disconnectWebSocket();
      }

      function initTabElection() {
        if (!window.BroadcastChannel) {
          connectWebSocket();
          return;
        }
        channel = new BroadcastChannel(CHANNEL_NAME);
        let election = setTimeout(becomeMaster, 260);
        channel.onmessage = (event) => {
          const data = event.data || {};
          if (data.tabId === tabId) return;
          if (data.type === "probe" && isMaster) channel.postMessage({ type: "master", tabId });
          if (data.type === "master") {
            clearTimeout(election);
            if (isMaster && data.tabId < tabId) yieldMaster();
          }
          if (data.type === "closed") {
            clearTimeout(election);
            election = setTimeout(becomeMaster, 180);
          }
        };
        channel.postMessage({ type: "probe", tabId });
        addEventListener("pagehide", () => {
          if (isMaster) channel.postMessage({ type: "closed", tabId });
        });
      }

      async function acquireWakeLock() {
        if (!("wakeLock" in navigator) || wakeLock || document.visibilityState !== "visible") return;
        try {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => { wakeLock = null; });
        } catch (_) {}
      }

      function loadVolume() {
        const saved = clamp(safeNumber(localStorage.getItem(STORAGE_VOLUME), .8), 0, 1);
        audio.volume = saved;
        $("volumeRange").value = String(saved);
        $("volumeRange").style.setProperty("--volume-percent", `${saved * 100}%`);
        renderVolumeIcon();
      }

      function renderVolumeIcon() {
        const value = audio.volume;
        $("volumeButton").innerHTML = icon(value === 0 ? "volume-x" : value < .5 ? "volume-1" : "volume-2");
        refreshIcons();
      }

      function setVolume(value) {
        const volume = clamp(safeNumber(value), 0, 1);
        audio.volume = volume;
        $("volumeRange").value = String(volume);
        $("volumeRange").style.setProperty("--volume-percent", `${volume * 100}%`);
        localStorage.setItem(STORAGE_VOLUME, String(volume));
        if (volume > 0) localStorage.setItem(STORAGE_MUTED_VOLUME, String(volume));
        renderVolumeIcon();
      }

      function toggleFullscreen() {
        if (!document.fullscreenEnabled) return;
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        else document.documentElement.requestFullscreen().catch(() => {});
      }

      function renderFullscreen() {
        const button = $("fullscreenButton");
        button.disabled = !document.fullscreenEnabled;
        button.innerHTML = icon(document.fullscreenElement ? "minimize-2" : "maximize-2");
        button.setAttribute("aria-label", document.fullscreenElement ? "退出全屏" : "进入全屏");
        refreshIcons();
      }

      audio.addEventListener("playing", () => report("playing"));
      audio.addEventListener("loadeddata", () => report("buffer_ready"));
      audio.addEventListener("loadstart", () => report("stream_connected"));
      audio.addEventListener("ended", reconnectStream);
      audio.addEventListener("error", reconnectStream);
      $("previousButton").addEventListener("click", () => sendSessionControl("previous"));
      $("nextButton").addEventListener("click", () => sendSessionControl("next"));
      $("playPauseButton").addEventListener("click", () => sendSessionControl(currentSession && currentSession.state === "playing" ? "pause" : "play"));
      $("fullscreenButton").addEventListener("click", toggleFullscreen);
      document.addEventListener("fullscreenchange", renderFullscreen);
      $("volumeButton").addEventListener("click", (event) => {
        event.stopPropagation();
        const popup = $("volumePop");
        const open = !popup.classList.contains("open");
        popup.classList.toggle("open", open);
        $("volumeButton").setAttribute("aria-expanded", String(open));
      });
      $("volumeRange").addEventListener("input", (event) => setVolume(event.target.value));
      document.querySelectorAll(".fallback-poster").forEach((fallbackPoster) => fallbackPoster.addEventListener("error", (event) => {
        const poster = event.currentTarget;
        poster.hidden = true;
        poster.closest(".artwork-fallback").classList.add("poster-error");
      }));
      $("volumePop").addEventListener("click", (event) => event.stopPropagation());
      document.addEventListener("click", () => {
        $("volumePop").classList.remove("open");
        $("volumeButton").setAttribute("aria-expanded", "false");
      });
      document.addEventListener("pointerdown", () => {
        unlockAudioFromGesture();
        acquireWakeLock();
      }, { passive: true });
      document.addEventListener("visibilitychange", () => {
        acquireWakeLock();
        if (!document.hidden && !animationFrame) {
          backgroundLastFrame = performance.now();
          animationFrame = requestAnimationFrame(drawBackground);
        }
      });
      window.addEventListener("resize", resizeLayout);
      window.addEventListener("resize", updateMetadataMarquees);
      window.addEventListener("orientationchange", resizeLayout);
      setInterval(() => {
        if (currentSession && (currentSession.state === "playing" || currentSession.state === "paused")) renderProgress();
      }, 250);

      resizeLayout();
      configureBackgroundQuality(detectBackgroundQuality());
      loadVolume();
      refreshIcons();
      renderFullscreen();
      initTabElection();
      acquireWakeLock();
      animationFrame = requestAnimationFrame(drawBackground);
      window.addEventListener("pagehide", () => cancelAnimationFrame(animationFrame));
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/pod/sw.js", { scope: "/pod" }).catch(() => {});
      }
    })();
  </script>
</body>
</html>
