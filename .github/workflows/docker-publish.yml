name: Build and Push Docker Image (Latest & Dev)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '.github/workflows/release.yml'
      - '**.md'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  packages: write
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- 基础纯净版 (latest / main) ---
          - target_name: "standard"
            dockerfile: "Dockerfile"
            tag_suffix: "latest"
          # --- AirPlay 2 增强版 (dev) ---
          - target_name: "airplay2-dev"
            dockerfile: "Dockerfile.dev"
            tag_suffix: "dev"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKER_USER != '' && secrets.DOCKER_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Lowercase repo owner
        id: lowercase
        run: echo "repo_owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Compute Image Tags
        id: tags
        run: |
          OWNER="${{ steps.lowercase.outputs.repo_owner }}"
          REPO="${GITHUB_REPOSITORY#*/}"
          SUFFIX="${{ matrix.tag_suffix }}"
          
          TAG_GHCR="ghcr.io/${OWNER}/${REPO}:${SUFFIX}"
          
          if [ -n "${{ secrets.DOCKER_USER }}" ]; then
            TAG_DOCKER="${{ secrets.DOCKER_USER }}/${REPO}:${SUFFIX}"
            echo "final_tags=${TAG_GHCR},${TAG_DOCKER}" >> $GITHUB_OUTPUT
          else
            echo "final_tags=${TAG_GHCR}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push (${{ matrix.target_name }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.tags.outputs.final_tags }}
          cache-from: type=gha,scope=${{ matrix.target_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target_name }}
          provenance: false

